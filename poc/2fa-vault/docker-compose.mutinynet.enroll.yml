# Use this overlay only for first invite-gated /v1/enroll/* enrollment.
# After finish succeeds, restart from docker-compose.mutinynet.yml alone and
# remove this token file. This overlay does not add /v1/register.
services:
  vault-authorizer:
    environment:
      VAULT_ENROLLMENT_TOKEN_FILE: /run/secrets/vault_enrollment_token
    secrets:
      - source: vault_enrollment_token
        target: vault_enrollment_token

secrets:
  vault_enrollment_token:
    file: ${VAULT_ENROLLMENT_TOKEN_FILE:?set VAULT_ENROLLMENT_TOKEN_FILE for first enrollment only}
